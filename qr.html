<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResQLink — Expo Go Tunnel QR Code (SDK 57)</title>
  <style>
    body {
      background-color: #06090F;
      color: #E7ECF3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #0B0F17;
      border: 1px solid #232B3D;
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    h1 {
      color: #35E0C8;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #7C8AA0;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .qr-container {
      background-color: #FFFFFF;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 20px;
    }
    img {
      display: block;
      width: 280px;
      height: 280px;
    }
    .url-box {
      background-color: #121826;
      border: 1px solid #2A5A6B;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      color: #35E0C8;
      font-size: 14px;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      background: rgba(53, 224, 200, 0.15);
      border: 1px solid #35E0C8;
      color: #35E0C8;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .note {
      color: #3DDC97;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">EXPO SDK 57 • TUNNEL MODE</div>
    <h1>Scan with Expo Go</h1>
    <p>Point your phone's camera (iOS) or the Expo Go scanner (Android) at this code:</p>

    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=exp%3A%2F%2Fio2waue-anonymous-8081.exp.direct" alt="Expo Go QR Code">
    </div>

    <div class="url-box">
      exp://io2waue-anonymous-8081.exp.direct
    </div>

    <div class="note">
      ✓ Upgraded to Expo SDK 57 • Tunnel Active
    </div>
  </div>
</body>
</html>
